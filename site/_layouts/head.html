<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{root}}assets/img/hero-robot.jpg">
<meta name="theme-color" content="#0b0d12">
{{canonical}}
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="{{root}}assets/css/site.css">
<script>
  try { var t = localStorage.getItem("bl-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="{{root}}assets/js/site.js" defer></script>
